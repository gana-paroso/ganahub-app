<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간편접수 · GanaHub</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="toss.css">
</head>
<body data-nav="quick">
<aside class="app-side" id="side"></aside>

<main class="app-main t-main sp">
  <div class="t-top"><div><h1>간편접수</h1><p class="t-lead">받은 문의를 업무 포털에 ‘수기접수’ 요청업무로 대신 등록해요.</p></div></div>

  <!-- 업무 포털 설정이 비어 있을 때 -->
  <section class="t-card q-card" id="need" hidden>
    <div class="t-empty">업무 포털 연동 설정이 비어 있어요.<br>전역 설정에서 서버 주소, 업무 ID, 공용 키를 먼저 등록해 주세요.<br><a class="btn t-cta" href="settings-toss.html">전역 설정으로 이동</a></div>
  </section>

  <section class="t-card t-pad q-card" id="form">
    <div class="q-who"><span class="chip"><b>등록자</b><span class="num" id="staff">user</span></span><span class="t-sub">등록자는 전역 설정의 업무 ID 직원으로 기록돼요</span></div>

    <div class="fld q-ctrt">
      <label for="ctrt">계약</label>
      <div class="combo" id="combo">
        <input class="input" id="ctrt" placeholder="계약명 또는 고객사명 검색" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="dd">
        <button class="combo-clear" type="button" id="clear" aria-label="선택 해제" hidden>×</button>
        <div class="dd" id="dd" role="listbox" hidden></div>
      </div>
      <em class="hint" id="hint">계약 목록을 불러오는 중…</em>
    </div>

    <label class="fld" for="body">내용
      <textarea class="textarea" id="body" placeholder="문의 내용을 입력해 주세요." style="min-height:240px"></textarea></label>

    <div class="notice" id="res" hidden></div>
    <div class="t-acts end s-act"><button class="btn t-cta" type="button" id="submit">등록</button></div>
  </section>
</main>

<script src="app.js"></script>
<script>
/* 업무 포털의 계약 목록을 불러와 고르고, 받은 문의를 ‘수기접수’ 요청업무로 대신 등록한다. 접속 설정과 연동 규격은 전역 설정에서 정한다. */
const $ = id => document.getElementById(id);
let CTRTS = [], sel = null, busy = false, loaded = false;

const label = c => `${c.nm} · ${c.cust}`;
function openDd() {
  if (!loaded) return;
  const t = ($("ctrt").value === (sel && label(sel)) ? "" : $("ctrt").value).trim().toLowerCase();
  const rows = CTRTS.filter(c => !t || c.nm.toLowerCase().includes(t) || c.cust.toLowerCase().includes(t));
  $("dd").innerHTML = rows.length ? rows.map(c => `<button type="button" role="option" class="opt${sel && sel.id === c.id ? " on" : ""}" data-id="${esc(c.id)}"><b>${esc(c.nm)}</b><span>${esc(c.cust)}</span><i class="fs ${c.st === "진행" ? "A" : c.st === "종료" ? "D" : ""}">${esc(c.st)}</i></button>`).join("") : `<div class="t-empty" style="padding:20px">검색 결과가 없어요.</div>`;
  $("dd").hidden = false; $("ctrt").setAttribute("aria-expanded", "true");
}
const closeDd = () => { $("dd").hidden = true; $("ctrt").setAttribute("aria-expanded", "false"); };
function pick(c) { sel = c; $("ctrt").value = c ? label(c) : ""; $("clear").hidden = !c; closeDd(); }

$("ctrt").addEventListener("focus", openDd);
$("ctrt").addEventListener("input", () => { sel = null; $("clear").hidden = true; openDd(); });
$("dd").addEventListener("mousedown", e => { const o = e.target.closest("[data-id]"); if (o) { e.preventDefault(); pick(CTRTS.find(c => String(c.id) === o.dataset.id)); } });
$("ctrt").addEventListener("blur", () => { closeDd(); if (!sel) $("ctrt").value = ""; });
$("clear").addEventListener("mousedown", e => { e.preventDefault(); pick(null); $("ctrt").focus(); });
$("ctrt").addEventListener("keydown", e => { if (e.key === "Escape") closeDd(); });

const show = (ok, msg) => { const r = $("res"); r.hidden = false; r.className = "notice" + (ok === false ? " neg" : ok ? " ok" : ""); r.innerHTML = msg; };

/** 계약 목록을 업무 포털에서 불러온다. */
async function loadContracts() {
  loaded = false; $("hint").textContent = "계약 목록을 불러오는 중…";
  try {
    CTRTS = (await api.works.contracts()).map(c => ({ id: c.id, nm: c.name, cust: c.customer, st: c.status }));
    loaded = true; $("hint").textContent = `계약 ${CTRTS.length}건`;
  } catch (e) {
    $("hint").innerHTML = `계약 목록 조회 실패: ${esc(e.message)} <a href="#" data-retry>다시 시도</a>`;
  }
}
$("hint").addEventListener("click", e => { if (e.target.closest("[data-retry]")) { e.preventDefault(); loadContracts(); } });

$("submit").addEventListener("click", async () => {
  if (busy) return;
  const body = $("body").value.trim();
  if (!sel) return show(false, "계약을 선택해 주세요.");
  if (!body) return show(false, "내용을 입력해 주세요.");
  busy = true; $("submit").disabled = true; show(null, "등록 중…");
  try {
    const r = await api.works.register({ ctrtId: sel.id, body });
    show(true, `요청업무 #${esc(r.postId)}이(가) 등록됐어요. <a href="#" data-open="${esc(r.url)}">${esc(r.url)}</a>`);
    $("body").value = ""; /* 계약은 연속 접수를 위해 그대로 둔다 */
  } catch (e) {
    show(false, esc(e.message));
  } finally { busy = false; $("submit").disabled = false; }
});
$("res").addEventListener("click", async e => {
  const a = e.target.closest("[data-open]"); if (!a) return;
  e.preventDefault();
  try { await api.works.open(a.dataset.open); } catch (err) { toast(err.message); }
});

/** 설정과 연동 규격이 준비돼 있으면 계약 목록을 불러오고, 아니면 전역 설정으로 안내한다. */
(async () => {
  let s, prof;
  try { [s, prof] = await Promise.all([api.settings.get(), api.works.profile()]); } catch (e) { toast(e.message); return; }
  $("staff").textContent = s.works.staffId || "-";
  const missing = !s.works.url || !s.works.staffId || !s.works.hasKey ? "업무 포털 연동 설정이 비어 있어요.<br>전역 설정에서 서버 주소, 업무 ID, 공용 키를 먼저 등록해 주세요."
    : !prof.ok ? "업무 포털 연동 규격이 없어요.<br>전역 설정의 업무 포털 연동에서 규격 파일을 가져와 주세요." : "";
  if (missing) {
    $("need").querySelector(".t-empty").innerHTML = `${missing}<br><a class="btn t-cta" href="settings-toss.html">전역 설정으로 이동</a>`;
    $("need").hidden = false; $("form").hidden = true; return;
  }
  $("need").hidden = true; $("form").hidden = false;
  loadContracts();
})();
</script>
</body>
</html>
