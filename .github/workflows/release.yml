# 버전 태그(v2.0.2 처럼 v + 숫자 3개)를 올릴 때만 동작해서, Windows 설치 파일을 빌드하고 GitHub Releases 에 초안(draft)으로 올린다.
# 앱과 설치 파일의 버전은 태그 이름에서 가져온다. (package.json 의 버전은 쓰지 않는다)
# 이 모양이 아닌 태그(v2.0, v2.0.2-beta, release-1 등)는 아무 일도 일어나지 않는다.
# 초안은 사용자 앱에 보이지 않는다. 확인한 뒤 Releases 화면에서 "Publish release" 를 눌러야 자동 업데이트가 나간다.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # 릴리즈를 만들고 파일을 올리려면 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 사내 정보나 비밀값이 섞여 있으면 여기서 빌드를 멈춘다. 금지 목록은 저장소 Secret DENY_LIST 에 넣어 둔다. (없으면 일반 규칙만 검사)
      - name: 공개 전 검사 (사내 정보·비밀값)
        run: node scripts/check-secrets.js
        env:
          GANAHUB_DENY_LIST: ${{ secrets.DENY_LIST }}

      - run: npm ci

      # 설치 파일 이름, latest.yml, 앱에 표시되는 버전이 모두 태그의 버전(v2.0.2 → 2.0.2)이 된다. 이 변경은 이 빌드 안에서만 쓰이고 저장소에는 커밋되지 않는다.
      - name: 태그에서 버전 정하기
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm test

      # electron-builder 가 직접 올리면 같은 태그의 릴리즈가 여러 개 생기는 문제가 있어서,
      # 빌드만 하고 업로드는 아래에서 릴리즈를 한 번에 하나만 만들면서 처리한다.
      - name: 설치 파일 빌드 (업로드 없음)
        run: npx electron-builder --win nsis --publish never

      - name: 릴리즈(초안) 한 번에 만들고 파일 3개 업로드
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 앱의 자동 업데이트에 필요한 3개 파일이 모두 있는지 먼저 확인한다.
          for f in dist/GanaHub-Setup-*.exe dist/GanaHub-Setup-*.exe.blockmap dist/latest.yml; do
            [ -f "$f" ] || { echo "빌드 결과에 $f 가 없습니다."; exit 1; }
          done
          git log -1 --format=%B > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/GanaHub-Setup-*.exe dist/GanaHub-Setup-*.exe.blockmap dist/latest.yml \
            --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
